<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspirar Informática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Trilha Digital: layout em trilha (mapa de módulos) com painel lateral do personagem; escola, não painel corporativo */
:root{
  --ink:#1c2452; --muted:#5d668f; --bg:#f4f6ff; --card:#ffffff; --line:#dfe4fa; --soft:#eef1ff;
  --brand:#237f9f; --brand-ink:#ffffff; --sun:#ffc43d; --teal:#1fb5a3; --coral:#ff7a45; --pink:#ff6fa5;
  --good:#17935a; --good-bg:#dff6ea; --bad:#d6435a; --bad-bg:#fde4e8; --warn-bg:#fff2cc;
  --shadow:0 2px 0 rgba(28,36,82,.06),0 10px 24px -12px rgba(28,36,82,.25);
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --m1:#3a86ff; --m2:#1fb5a3; --m3:#8a5cf6; --m4:#ff7a45; --m5:#17935a; --m6:#ff6fa5; --m7:#e8a400;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eaedff; --muted:#a6aedb; --bg:#12162f; --card:#1b2040; --line:#2d3466; --soft:#232950;
  --brand:#6cc3de; --brand-ink:#10143a; --good:#4fd696; --good-bg:#16382b; --bad:#ff7f93; --bad-bg:#40202b; --warn-bg:#3d3513;
  --shadow:0 10px 24px -12px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#eaedff; --muted:#a6aedb; --bg:#12162f; --card:#1b2040; --line:#2d3466; --soft:#232950;
  --brand:#6cc3de; --brand-ink:#10143a; --good:#4fd696; --good-bg:#16382b; --bad:#ff7f93; --bad-bg:#40202b; --warn-bg:#3d3513;
  --shadow:0 10px 24px -12px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
svg.i.fill{fill:currentColor}
/* topo */
.top{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.3rem}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.92rem}
.chip.sun{background:var(--warn-bg)}
.badge-demo{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:.78rem;font-weight:800;letter-spacing:.02em}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 20px;font-weight:800;background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.good{background:var(--good);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
/* login */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:34px 0 10px}
.hero .chars{display:flex;gap:6px;justify-content:center;background:linear-gradient(160deg,#fff1c9,#d8f3ee);border-radius:32px;padding:14px 14px 0;border:2px solid var(--line)}
.hero .chars div{width:42%;max-width:210px;aspect-ratio:200/262}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}
.role{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.role:hover{border-color:var(--brand)}
.role .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;margin-bottom:4px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;color:var(--ink)}
.pick:hover{border-color:var(--brand)}
/* aluno */
.home{display:grid;grid-template-columns:300px 1fr;gap:22px;padding:22px 0 50px;align-items:start}
.hero-card{text-align:center;position:sticky;top:84px}
.fig{width:170px;aspect-ratio:200/262;margin:6px auto 0;position:relative}
.stagebg{border-radius:26px;padding:12px 12px 0;margin:10px 0 12px}
.stagebar{display:flex;gap:5px;justify-content:center;margin:10px 0}
.stagebar i{width:26px;height:9px;border-radius:5px;background:var(--line)}
.stagebar i.on{background:var(--sun)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-top:12px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.trail{display:flex;flex-direction:column;gap:0;position:relative}
.node{display:flex;gap:16px;align-items:stretch;position:relative;padding-bottom:18px}
.node:last-child{padding-bottom:0}
.node .spine{width:62px;display:flex;flex-direction:column;align-items:center;flex:none}
.node .dot{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.5rem;border:4px solid var(--card);box-shadow:0 0 0 3px var(--c);background:var(--c);flex:none}
.node.locked .dot{background:var(--line);box-shadow:0 0 0 3px var(--line);color:var(--muted)}
.node .line{flex:1;width:6px;margin-top:4px;border-radius:3px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px)}
.node:last-child .line{display:none}
.node.done .line{background:var(--c)}
.mcard{flex:1;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);text-align:left;color:var(--ink);display:block;width:100%}
button.mcard:hover{transform:translateY(-2px)}
.node.locked .mcard{border-left-color:var(--line);opacity:.75;box-shadow:none}
.mcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:800;background:var(--soft)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--c,var(--brand));border-radius:6px}
.stars{display:inline-flex;gap:2px;color:var(--sun)}
.stars .off{color:var(--line)}
.lessons{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.les{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card);width:100%;text-align:left;color:var(--ink)}
button.les:hover{border-color:var(--c)}
.les .n{width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.les.locked{opacity:.6}.les.locked .n{background:var(--line);color:var(--muted)}
.crumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:700;padding:16px 0 4px;flex-wrap:wrap}
.crumb button{background:none;border:0;color:var(--brand);font-weight:800;padding:0}
/* aula */
.player{max-width:820px;margin:0 auto;padding:18px 0 60px}
.prog{display:flex;gap:6px;margin-bottom:16px}
.prog i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.prog i.on{background:var(--c)}.prog i.now{background:var(--sun)}
.step{padding:26px}
.step .talk{display:flex;gap:18px;align-items:flex-end}
.step .talk .fig{width:110px;margin:0;flex:none}
.bubble{background:var(--soft);border-radius:20px;padding:18px 20px;font-size:1.12rem;position:relative;flex:1}
.bubble h2{margin-bottom:6px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.btn,button.mcard{transition:none}}
.feed{margin-top:14px;font-weight:800;min-height:1.6em}
.feed.ok{color:var(--good)}.feed.no{color:var(--bad)}
.scene{background:linear-gradient(#dfe9ff,#eef1ff);border-radius:20px;padding:14px;margin-top:14px;display:flex;justify-content:center}
.scene svg{max-width:420px;width:100%;height:auto}
.scene [data-part]{cursor:pointer}.scene [data-part]:hover{filter:brightness(1.1)}
.arena{position:relative;height:250px;background:var(--soft);border-radius:18px;margin-top:14px;border:2px dashed var(--line);overflow:hidden}
.target{position:absolute;width:58px;height:58px;border-radius:50%;border:0;background:var(--coral);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.ordbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ordlist{counter-reset:o;display:grid;gap:8px;margin-top:12px}
.ordlist div{counter-increment:o;background:var(--good-bg);border-radius:12px;padding:8px 12px;font-weight:800}
.ordlist div::before{content:counter(o) ". "}
/* digitação */
.typebox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-top:14px;font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;font-size:1.55rem;line-height:2.1;letter-spacing:.03em;min-height:110px;cursor:text;word-break:break-word}
.typebox .ok{color:var(--good)}.typebox .cur{background:var(--sun);color:#1c2452;border-radius:5px}
.typebox .nx{color:var(--muted)}
.typebox.err .cur{background:var(--bad);color:#fff}
.typebox.focus{border-color:var(--brand)}
.kb{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:14px}
.kb div{display:flex;gap:5px}
.kb span{min-width:34px;height:36px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:.9rem;color:var(--muted);border-bottom:3px solid var(--line)}
.kb span.hl{background:var(--sun);color:#1c2452;border-color:#d9a400}
.kb span.sp{min-width:200px}
.live{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* word */
.word{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);margin-top:14px}
.wtitle{background:#2b5797;color:#fff;padding:7px 14px;font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center}
.ribbon{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;background:#eef2fb;border-bottom:2px solid var(--line);color:#1c2452}
.ribbon button{min-width:38px;height:38px;border:1px solid #c5cff0;background:#fff;border-radius:8px;font-weight:800;color:#1c2452;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 8px}
.ribbon button:hover{background:#dfe7ff}
.ribbon .sep{width:2px;background:#c5cff0;margin:2px 4px}
.sheet{background:#d6dbea;padding:14px}
.paper{background:#fff;color:#111;min-height:210px;max-width:560px;margin:0 auto;padding:26px 32px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-family:'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.5;outline:none}
.paper p{margin:0 0 12px}
.tasks{display:grid;gap:8px;margin-top:14px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--soft);padding:10px 14px;border-radius:14px;font-weight:700}
.task.done{background:var(--good-bg);color:var(--good)}
.task .hint{font-weight:600;color:var(--muted);font-size:.9rem}
/* resultados */
.score{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1}
.cert{border:6px double #b98a1c;background:linear-gradient(#fffdf4,#fff6d6);color:#3a2d08;border-radius:12px;padding:30px 26px;text-align:center;max-width:760px;margin:16px auto 0}
.cert h2{font-size:2rem;color:#7a5a08}
.cert .name{font-family:var(--display);font-size:2.2rem;font-weight:800;margin:10px 0;border-bottom:2px solid #b98a1c;display:inline-block;padding:0 24px}
/* tabelas */
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tblwrap{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1}
.tile span{color:var(--muted);font-weight:700;font-size:.85rem}
.mini{display:inline-flex;gap:3px;align-items:center}
.mini i{width:18px;height:10px;border-radius:3px;background:var(--line)}
.mini i.on{background:var(--c)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.note{background:var(--warn-bg);border-radius:14px;padding:10px 14px;font-size:.92rem}
.hint-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;text-align:center}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}.home{grid-template-columns:1fr}.hero-card{position:static}
  .step .talk{flex-direction:column;align-items:stretch}.step .talk .fig{display:none}
  h1{font-size:1.7rem}.typebox{font-size:1.2rem}
}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;display:flex;gap:10px;align-items:center;font-weight:800;z-index:20;box-shadow:var(--shadow);animation:pop .35s,fade .4s 2.1s forwards}
.toast svg.i{color:var(--sun)}
@keyframes pop{from{transform:translate(-50%,24px) scale(.8);opacity:0}}
@keyframes fade{to{opacity:0}}
.bag{margin-top:14px;text-align:left}
.stkrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stk{display:inline-flex}
.modal{position:fixed;inset:0;background:rgba(20,24,60,.55);display:grid;place-items:center;padding:16px;z-index:30}
.sel{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
.a-cur{animation:cur 5s infinite ease-in-out;transform-box:fill-box}
@keyframes cur{0%{transform:translate(330px,190px)}30%,100%{transform:translate(98px,108px)}}
.a-ring circle{animation:ring 5s infinite}
@keyframes ring{0%,32%{opacity:0;r:6}38%{opacity:1;r:10}46%{opacity:0;r:26}52%{opacity:1;r:10}60%,100%{opacity:0;r:30}}
.a-win{animation:win 5s infinite}
@keyframes win{0%,58%{opacity:0}66%,100%{opacity:1}}
.a-key rect{animation:key 3.6s infinite;animation-delay:inherit}
.a-key{animation:none}
@keyframes key{0%,18%,100%{fill:#fff}8%{fill:#ffc43d}}
.a-ok{animation:win 3s infinite}
@media (prefers-reduced-motion:reduce){.a-cur{animation:none;transform:translate(98px,108px)}.a-ring circle,.a-key rect,.toast{animation:none}.a-win,.a-ok{animation:none;opacity:1}}
.xbar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#f3f6fb;border-bottom:2px solid var(--line);color:#1c2452}
.xref{min-width:52px;text-align:center;background:#fff;border:1px solid #c5cff0;border-radius:6px;font-weight:800;padding:4px 8px}
.fx{font-style:italic;font-weight:800;color:#1d6f42}
.xbar input{flex:1;font:inherit;padding:6px 8px;border:1px solid #c5cff0;border-radius:6px;background:#fff;color:#111;min-width:0}
.xwrap{overflow-x:auto;background:#fff;color:#111}
table.xl{border-collapse:collapse;width:100%;min-width:480px;table-layout:fixed;font-size:.95rem}
table.xl th{background:#eef2fb;color:#1c2452;border:1px solid #d3d9ee;font-size:.8rem;padding:4px;width:auto}
table.xl th:first-child{width:34px}
table.xl td{border:1px solid #d3d9ee;height:32px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell}
table.xl td.sel{outline:3px solid #1d6f42;outline-offset:-2px;background:#eaf7ef}
.xchartbox{padding:12px 16px;background:var(--card);color:var(--ink);border-top:2px solid var(--line)}
.pwrap{display:flex;gap:0;background:#d6dbea;color:#111}
.pthumbs{width:132px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#e9ecf6;overflow-y:auto;max-height:360px;flex:none}
.pth{position:relative;border:3px solid transparent;border-radius:8px;padding:0;background:none}
.pth.on{border-color:#c43e1c}.pth span{position:absolute;left:-1px;top:-1px;background:#c43e1c;color:#fff;font-size:.7rem;font-weight:800;padding:0 5px;border-radius:5px 0 5px 0;z-index:1}
.pslide{aspect-ratio:16/9;position:relative;border-radius:6px;overflow:hidden;padding:7% 8%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pslide .pt{font-family:var(--display);font-weight:800;font-size:.55rem;line-height:1.1}
.pslide .pb{font-size:.4rem;margin-top:4px}
.pslide.big .pt{font-size:2rem}.pslide.big .pb{font-size:1.15rem;margin-top:10px}
.pimg{position:absolute;right:6%;bottom:8%;width:26%}
.pmain{flex:1;padding:14px;min-width:0}
.pin{width:100%;background:transparent;border:2px dashed rgba(128,128,128,.5);color:inherit;font:inherit;border-radius:8px;padding:6px 10px}
.pin.pt{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.15;margin-bottom:8px}
.pin.pb{font-size:1.15rem;resize:none;height:42%}
.pin::placeholder{color:inherit;opacity:.55}
.pplay .pslide.big{border-radius:10px}
.fadein{animation:fi .8s}@keyframes fi{from{opacity:0}}
.slidein{animation:si .6s}@keyframes si{from{transform:translateX(60px);opacity:0}}
@media (max-width:600px){.pthumbs{width:84px}.pslide.big .pt{font-size:1.3rem}}
.kb span.mod{min-width:70px;font-size:.8rem}

.brandlogo{height:64px;width:auto;display:block}
.hero .logobig{max-width:280px;width:100%;display:block;margin:0 0 10px}
@media (max-width:820px){.brandlogo{height:52px}}

</style>
</head>
<body>
<div id="app"></div>
